docker:
  compose:
    enabled: false

flyway:
  enabled: false

h2:
  console:
    enabled: true
    path: /h2-console

datasource:
  url: jdbc:h2:mem:testdb
  driver-class-name: org.h2.Driver
  username: sa
  password:


jpa:
  hibernate:
    ddl-auto: validate   # dôležité, nech sa to nebije so script generation
  properties:
    jakarta.persistence.schema-generation.scripts.action: drop-and-create
    akarta.persistence.schema-generation.create-source: metadata
    jakarta.persistence.schema-generation.scripts.create-target: schema.sql
    jakarta.persistence.schema-generation.scripts.drop-target: drop.sql
    database-platform: org.hibernate.dialect.H2Dialect
  ibernate:
    format_sql: true
    show_sql: true